[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

# Windows: ort prebuilt is built /MD (dynamic CRT). Do NOT force +crt-static
# here — it triggers LNK2001 __imp_* errors when ort's /MD-built objects are
# linked against static CRT.

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"
# Windows: build from "x64 Native Tools Command Prompt for VS 2022" so
# vcvars64.bat seeds INCLUDE/LIB/PATH. Setting CC_<target> here makes cc-rs
# default the compiler family to GNU and emit GCC-style flags
# (-fvisibility=hidden, -W4) that cl.exe rejects with D9002 + exit 2.
