# SLURM Configuration File
# For MLOps HPC Cluster

ClusterName=mlops-cluster
SlurmctldHost=slurmctld

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Resource Limits
DefMemPerCPU=4096
MaxMemPerCPU=16384

# Logging
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmSchedLogFile=/var/log/slurm/slurmscheduler.log

# State Preservation
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d

# Process Tracking
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup

# Prolog/Epilog
#Prolog=/etc/slurm/prolog.sh
#Epilog=/etc/slurm/epilog.sh

# Timeouts
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# Priorities
PriorityType=priority/multifactor
PriorityDecayHalfLife=14-0
PriorityUsageResetPeriod=MONTHLY
PriorityWeightAge=1000
PriorityWeightFairshare=10000
PriorityWeightJobSize=500
PriorityWeightPartition=1000
PriorityWeightQOS=2000

# Accounting
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmctld
AccountingStoragePort=6819

# Job Completion
JobCompType=jobcomp/none

# Compute Nodes
NodeName=compute[1-4] CPUs=8 RealMemory=32000 Gres=gpu:1 State=UNKNOWN

# Partitions
PartitionName=gpu Nodes=compute[1-4] Default=YES MaxTime=INFINITE State=UP Priority=100
PartitionName=cpu Nodes=compute[1-2] Default=NO MaxTime=INFINITE State=UP Priority=50

# GPU Configuration
GresTypes=gpu
