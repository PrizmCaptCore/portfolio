[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-integration"
version = "0.2.0"
description = "Orthanc (DICOM) <-> EHRbase (openEHR) bridge with pseudonymization and DICOM de-identification"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydicom>=2.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black", "mypy"]

[project.scripts]
hci = "healthcare_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
