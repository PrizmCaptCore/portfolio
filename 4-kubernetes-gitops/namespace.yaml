apiVersion: v1
kind: Namespace
metadata:
  name: mlops
  labels:
    name: mlops
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-sa
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-role
  namespace: mlops
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-rolebinding
  namespace: mlops
subjects:
- kind: ServiceAccount
  name: mlops-sa
  namespace: mlops
roleRef:
  kind: Role
  name: mlops-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-quota
  namespace: mlops
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    requests.storage: 1Ti
    persistentvolumeclaims: "50"
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mlops-limitrange
  namespace: mlops
spec:
  limits:
  - max:
      cpu: "8"
      memory: 32Gi
    min:
      cpu: "100m"
      memory: 128Mi
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: "500m"
      memory: 1Gi
    type: Container
  - max:
      storage: 500Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim
