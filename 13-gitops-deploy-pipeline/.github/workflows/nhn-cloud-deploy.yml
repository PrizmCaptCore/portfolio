name: NHN Cloud Deploy

# 트리거 2가지:
#   1) repository_dispatch (기본 배포 경로)
#      제품 repo가 main 머지 후 release TAG를 딸 때 이 레포로 dispatch 이벤트를 보냅니다.
#      제품 repo 쪽 발신 워크플로우 예시: cloud_deploy/nhn_terraform/examples/product-repo-release-trigger.yml
#      dispatch로 들어온 배포는 자동으로 apply까지 수행합니다.
#   2) workflow_dispatch (수동 실행, 디버깅/최초 검증용)
#
# 필요한 GitHub Secrets (environment: NHN_CLOUD_SECRETS_ENV):
#   NHN_CLOUD_API_USER_ID   - 콘솔 로그인 계정 ID (일반 회원: 이메일 / IAM 멤버: IAM 계정 ID) (OS_USERNAME)
#                             ※ 콘솔에 표시되는 UUID 형태의 ID가 아님! 토큰 발급 시 401 "Could not find user"가 나면 이 값 확인
#   NHN_CLOUD_API_PASSWORD  - API 엔드포인트 설정에서 저장한 API 비밀번호 (로그인 비밀번호와 별개) (OS_PASSWORD)
#   NHN_CLOUD_TENANT_ID     - NHN Cloud 프로젝트(테넌트) ID (OS_TENANT_ID)
#   PRIVATE_REPO_TOKEN      - 배포 대상 private repo read 권한만 가진 fine-grained PAT
#
# 필요한 GitHub Variables (Settings > Secrets and variables > Actions > Variables):
#   TFSTATE_BUCKET          - 원격 tfstate 를 저장할 Object Storage 버킷 이름 (partial backend config 로 주입)
on:
  repository_dispatch:
    types: [deploy-nhn]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "배포할 내부 private repo (owner/repo 형식, 예: your-org/some-product)"
        required: true
        type: string
      target_ref:
        description: "배포할 브랜치 또는 태그"
        required: false
        default: "main"
        type: string
      tf_action:
        description: "terraform 동작"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

# terraform apply가 동시에 2개 돌면 state가 깨지므로 배포는 한 번에 하나만 실행합니다.
# (진행 중인 apply는 취소하지 않고, 뒤에 온 실행이 대기)
concurrency:
  group: nhn-cloud-deploy
  cancel-in-progress: false

# NHN Cloud terraform provider는 OpenStack 기반이라 OS_* 환경변수를 자동으로 읽습니다.
env:
  OS_USERNAME: ${{ secrets.NHN_CLOUD_API_USER_ID }}
  OS_PASSWORD: ${{ secrets.NHN_CLOUD_API_PASSWORD }}
  OS_TENANT_ID: ${{ secrets.NHN_CLOUD_TENANT_ID }}
  OS_AUTH_URL: https://api-identity-infrastructure.nhncloudservice.com/v2.0
  OS_REGION_NAME: KR1
  # 원격 tfstate backend(NHN Object Storage S3 호환; 버킷 이름은 repo Variable TFSTATE_BUCKET) 자격 증명
  AWS_ACCESS_KEY_ID: ${{ secrets.NHN_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.NHN_S3_SECRET_KEY }}
  # terraform 변수 주입 (variables.tf 참조)
  # 트리거 종류에 따라 값의 출처가 다릅니다: dispatch payload 또는 수동 입력값
  TF_VAR_deploy_repo: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo || inputs.target_repo }}
  TF_VAR_deploy_ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.target_ref }}
  TF_VAR_deploy_token: ${{ secrets.PRIVATE_REPO_TOKEN }}
  # release 태그 기반 dispatch는 항상 실배포(apply), 수동 실행은 선택값을 따름
  TF_ACTION: ${{ github.event_name == 'repository_dispatch' && 'apply' || inputs.tf_action }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    # secrets는 repo 레벨이 아니라 이 environment에 등록되어 있습니다.
    # (repo Settings > Environments > NHN_CLOUD_SECRETS_ENV)
    # 이 선언이 없으면 environment secrets가 주입되지 않아 인증이 빈 값으로 들어갑니다.
    environment: NHN_CLOUD_SECRETS_ENV
    defaults:
      run:
        working-directory: cloud_deploy/nhn_terraform/src
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      # 배포 대상 repo를 러너에서도 checkout 해봅니다.
      # 목적 1) repo 이름/토큰이 잘못된 경우 apply 전에 조기 실패
      # 목적 2) 이후 빌드/테스트 스텝을 추가할 자리 (예: docker build 후 NCR push)
      - name: Checkout target private repo (validation)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TF_VAR_deploy_repo }}
          ref: ${{ env.TF_VAR_deploy_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: target_src

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tf.plan

      - name: Terraform Apply
        if: ${{ env.TF_ACTION == 'apply' }}
        run: terraform apply -input=false -auto-approve tf.plan
