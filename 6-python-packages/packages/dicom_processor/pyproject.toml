[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-processor"
version = "0.8.1"
description = "DICOM image preprocessing utilities for medical imaging"
requires-python = ">=3.9"
dependencies = [
    "pydicom>=2.3.0",
    "numpy>=1.23.0",
    "pillow>=9.0.0",
    "simpleitk>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]
