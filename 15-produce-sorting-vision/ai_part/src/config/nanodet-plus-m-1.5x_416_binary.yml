# nanodet-plus-m-1.5x_416, two classes (normal / abnormal)
#
# One stage instead of two: this head decides "is this potato a reject" directly, so
# there is no separate crop-and-classify step. The cost is resolution -- a 219 px potato
# in a 1280x1024 frame arrives at the head as ~71 px, against the ~219 px a crop-based
# classifier would have seen. Whether that is enough pixels for a surface lesion is the
# question this run answers; if it is not, the lever is input_size, not the head.
#
# Derived from the single-class potato config. Changes from it:
#   num_classes 1 -> 2 (main head and auxiliary head must agree)
#   class_names ['potato'] -> ['normal', 'abnormal']
#   data paths -> datasets/potato_binary_nanodet, built by prepare_nanodet_binary.py
#     with a leak-free split (Roboflow's own split shares source photos across train and
#     valid, which is what made the previous experiment's numbers meaningless)
#   total_epochs 60 -> 80; telling two classes apart is harder than finding one
save_dir: runs/nanodet_binary
model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.5x
      out_stages: [2,3,4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [176, 352, 704]
      out_channels: 128
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 2
      input_channel: 128
      feat_channels: 128
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    # Auxiliary head, training only. Its num_classes must track the main head.
    aux_head:
      name: SimpleConvHead
      num_classes: 2
      input_channel: 256
      feat_channels: 256
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
data:
  train:
    name: YoloDataset
    class_names: &class_names ['normal', 'abnormal']
    img_path: datasets/potato_binary_nanodet/train
    ann_path: datasets/potato_binary_nanodet/train
    input_size: [416,416] #[w,h]
    keep_ratio: False
    pipeline:
      perspective: 0.0
      scale: [0.6, 1.4]
      stretch: [[0.8, 1.2], [0.8, 1.2]]
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast: [0.6, 1.4]
      saturation: [0.8, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: YoloDataset
    class_names: *class_names
    img_path: datasets/potato_binary_nanodet/valid
    ann_path: datasets/potato_binary_nanodet/valid
    input_size: [416,416] #[w,h]
    keep_ratio: False
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
device:
  gpu_ids: [0]
  workers_per_gpu: 8
  batchsize_per_gpu: 32
  precision: 16
schedule:
#  resume:
#  load_model:
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.05
  warmup:
    name: linear
    steps: 500
    ratio: 0.0001
  total_epochs: 80
  lr_schedule:
    name: CosineAnnealingLR
    T_max: 80
    eta_min: 0.00005
  val_intervals: 2
grad_clip: 35
evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP
log:
  interval: 50

class_names: *class_names
